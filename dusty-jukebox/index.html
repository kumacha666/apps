<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DustyJukebox</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #17151a;
      color: #e8e3d8;
      font-family: 'Segoe UI', sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      text-align: center;
      padding: 24px;
      /* 画面下に固定される.now-playing-barぶんの余白（実際の高さより多めに確保し、
         スクロール末尾のコンテンツがバーの下に隠れないようにする。#statusの文言は
         長くなることがあるため、audio-player単体だった頃より余裕を大きめに取る）。 */
      padding-bottom: 220px;
      gap: 12px;
    }
    /* 再生中の操作（シークバー・音量含む<audio controls>と現在再生中の曲名）・肝心なときに
       見落としやすいステータス/エラーメッセージ（#status）を、再生リストの操作中でも
       スクロールで見失わないよう画面下に固定する（2026-09-09、ユーザー指摘：単曲試聴欄の
       直下にあると再生リスト操作時に見えなくなる。#statusも同様に画面最下部にあり、
       肝心なときに目に入らないとの指摘を受け同じバーへ統合）。*/
    .now-playing-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      background: #221f27;
      border-top: 1px solid #3a3542;
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .now-playing-bar audio { width: 100%; }
    .now-playing-bar .status { text-align: left; }
    h1 { font-size: 24px; color: #d9a441; margin-bottom: 8px; }
    p { color: #9a9488; font-size: 14px; }
    p.lead { max-width: 32em; }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      max-width: 28em;
      text-align: left;
      font-size: 13px;
      color: #cfc9bb;
    }
    input {
      background: #221f27;
      border: 1px solid #3a3542;
      border-radius: 6px;
      color: #e8e3d8;
      padding: 8px 10px;
      font-size: 14px;
    }
    button {
      background: #d9a441;
      border: none;
      border-radius: 6px;
      color: #17151a;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #4a4438;
      color: #8a8578;
      cursor: not-allowed;
    }
    .status { min-height: 1.4em; }
    .status.error { color: #e07a5f; }
    .result-list {
      list-style: none;
      width: 100%;
      max-width: 28em;
      text-align: left;
      font-size: 13px;
      color: #cfc9bb;
    }
    .catalog { width: 100%; max-width: 42em; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: left; }
    .catalog h2 { align-self: flex-start; color: #d9a441; font-size: 18px; }
    .filter-years { display: flex; gap: 8px; width: 100%; }
    .filter-years label { flex: 1; font-size: 13px; color: #cfc9bb; }
    .filter-years input { width: 100%; }
    #now-playing { font-weight: 600; color: #d9a441; }
    .queue-item.now-playing { background: #2a2530; border-radius: 4px; }
    .song-link { cursor: pointer; }
    .song-link:hover { text-decoration: underline; }
    .album-artist-heading { font-weight: 600; color: #d9a441; margin-top: 8px; list-style: none; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
