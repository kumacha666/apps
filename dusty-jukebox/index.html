<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DustyJukebox</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* .now-playing-barはposition: fixed; left: 0; right: 0;で画面下に固定しているが、
       モバイルブラウザではページのどこかに横方向のはみ出し（例：長い1単語のフォルダ名等、
       折り返し点の無いテキスト）があると、レイアウトビューポート自体が画面の物理幅より
       広がり、fixed要素もそのレイアウトビューポート基準の幅（＝画面より広い）で描画されて
       しまう（2026-09-09、実機確認時にユーザー指摘：シークバーとステータス表示が画面外へ
       はみ出して見える）。html/bodyにoverflow-x: hiddenを設定し、原因箇所を個別に潰す前に
       ページ全体としては横スクロールが発生しない防御的な指定にしておく。 */
    html, body { overflow-x: hidden; }
    body {
      background: #17151a;
      color: #e8e3d8;
      font-family: 'Segoe UI', sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      text-align: center;
      padding: 24px;
      /* 画面下に固定される.now-playing-barぶんの余白。バーの高さは状態（#status文言の
         長さ・#playback-auth-notice表示の有無・OSの文字サイズ拡大等）で変動するため、
         固定値ではなくJS側（ResizeObserver、main.ts参照）が実測して--now-playing-bar-height
         へ反映する。JS実行前・ResizeObserver非対応環境向けのフォールバックとして
         220pxを既定値にしておく（2026-09-09、ChatGPTレビュー指摘：固定値だけでは
         認証通知＋長いエラー文言が重なった場合に末尾コンテンツがバーの下に隠れうる）。 */
      padding-bottom: calc(var(--now-playing-bar-height, 220px) + 16px);
      gap: 12px;
    }
    /* 再生中の操作（シークバー・現在再生中の曲名）・肝心なときに
       見落としやすいステータス/エラーメッセージ（#status）を、再生リストの操作中でも
       スクロールで見失わないよう画面下に固定する（2026-09-09、ユーザー指摘：単曲試聴欄の
       直下にあると再生リスト操作時に見えなくなる。#statusも同様に画面最下部にあり、
       肝心なときに目に入らないとの指摘を受け同じバーへ統合）。*/
    .now-playing-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      background: #221f27;
      border-top: 1px solid #3a3542;
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 4px;
      /* #now-playing（再生中の曲名。曲名・アーティスト・アルバム・folderPathがそのまま
         連結される、`.result-list`の再生リスト行と同じGoogle Drive由来のデータ）にも、
         区切りに空白を含まない長い1単語が来ると折り返せず画面外へはみ出しうる
         （2026-09-09、ChatGPTレビュー指摘：P2。`.result-list`側の対策だけでは、
         再生リスト外でその曲を実際に再生した場合の#now-playing自身は保護されない）。
         overflow-wrapは継承されるため、バー全体に指定して#now-playing/.status/
         #playback-auth-noticeいずれもまとめて保護する。 */
      overflow-wrap: anywhere;
    }
    /* 開発体制#42③（2026-09-09）：ネイティブ<audio controls>（シークバー・再生/一時停止
       アイコン・音量スライダー等、ブラウザ標準の見た目）と、アプリ独自の黄色ボタン群との
       UI/UXの差が大きいというユーザー指摘を受け、controls属性を外し独自シークバー
       （#seek-slider等、下記.seek-bar）へ一本化した。<audio>要素自体は再生には
       引き続き必要（PlaybackController/PlaybackQueue/MediaSessionが参照する）ため
       DOMには残すが、視覚的には非表示にする。 */
    .now-playing-bar audio { display: none; }
    .seek-bar { display: flex; align-items: center; gap: 8px; width: 100%; }
    .seek-bar input[type="range"] { flex: 1; accent-color: #d9a441; }
    .seek-time { font-size: 12px; color: #cfc9bb; min-width: 2.5em; text-align: center; }
    .now-playing-bar .status { text-align: left; }
    h1 { font-size: 24px; color: #d9a441; margin-bottom: 8px; }
    p { color: #9a9488; font-size: 14px; }
    p.lead { max-width: 32em; }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      max-width: 28em;
      text-align: left;
      font-size: 13px;
      color: #cfc9bb;
    }
    input {
      background: #221f27;
      border: 1px solid #3a3542;
      border-radius: 6px;
      color: #e8e3d8;
      padding: 8px 10px;
      font-size: 14px;
    }
    button {
      background: #d9a441;
      border: none;
      border-radius: 6px;
      color: #17151a;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #4a4438;
      color: #8a8578;
      cursor: not-allowed;
    }
    .status { min-height: 1.4em; }
    .status.error { color: #e07a5f; }
    .result-list {
      list-style: none;
      width: 100%;
      max-width: 28em;
      text-align: left;
      font-size: 13px;
      color: #cfc9bb;
      /* 曲名・フォルダパス（Google Drive由来、区切りに空白を含まない長い1単語が
         混ざりうる）が折り返し点を持たない場合でも、幅を超えてページ全体を
         横に広げてしまわないよう強制的に折り返す（overflow-wrapは継承されるため
         子要素のspan/label等にも及ぶ）。 */
      overflow-wrap: anywhere;
    }
    .catalog { width: 100%; max-width: 42em; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: left; }
    .catalog h2 { align-self: flex-start; color: #d9a441; font-size: 18px; }
    .filter-years { display: flex; gap: 8px; width: 100%; }
    .filter-years label { flex: 1; font-size: 13px; color: #cfc9bb; }
    .filter-years input { width: 100%; }
    #now-playing { font-weight: 600; color: #d9a441; }
    .queue-item.now-playing { background: #2a2530; border-radius: 4px; }
    .song-link { cursor: pointer; }
    .song-link:hover { text-decoration: underline; }
    .album-artist-heading { font-weight: 600; color: #d9a441; margin-top: 8px; list-style: none; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
