<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DustyJukebox</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #17151a;
      color: #e8e3d8;
      font-family: 'Segoe UI', sans-serif;
    }
    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      text-align: center;
      padding: 24px;
      gap: 12px;
    }
    h1 { font-size: 24px; color: #d9a441; margin-bottom: 8px; }
    p { color: #9a9488; font-size: 14px; }
    p.lead { max-width: 32em; }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      max-width: 28em;
      text-align: left;
      font-size: 13px;
      color: #cfc9bb;
    }
    input {
      background: #221f27;
      border: 1px solid #3a3542;
      border-radius: 6px;
      color: #e8e3d8;
      padding: 8px 10px;
      font-size: 14px;
    }
    button {
      background: #d9a441;
      border: none;
      border-radius: 6px;
      color: #17151a;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #4a4438;
      color: #8a8578;
      cursor: not-allowed;
    }
    .status { min-height: 1.4em; }
    .status.error { color: #e07a5f; }
    .result-list {
      list-style: none;
      width: 100%;
      max-width: 28em;
      text-align: left;
      font-size: 13px;
      color: #cfc9bb;
    }
    .catalog { width: 100%; max-width: 42em; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: left; }
    .catalog h2 { align-self: flex-start; color: #d9a441; font-size: 18px; }
    .filter-years { display: flex; gap: 8px; width: 100%; }
    .filter-years label { flex: 1; font-size: 13px; color: #cfc9bb; }
    .filter-years input { width: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
