function selType(btn) {
  document.querySelectorAll('#ce-types .type-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}
function selIcon(btn) {
  document.querySelectorAll('#ce-icons .icon-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}
function selColor(dot) {
  document.querySelectorAll('#ce-colors .color-dot').forEach(b => b.classList.remove('selected'));
  dot.classList.add('selected');
}
function addItemRow() {
  const idx = window._editItems.length;
  window._editItems.push('');
  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = `irow-${idx}`;
  div.innerHTML = `
    <input class="field-input" style="flex:1" placeholder="アイテム名..." data-idx="${idx}" onchange="updateItemVal(${idx},this.value)">
    <button class="item-del" onclick="removeItemRow(${idx})">✕</button>`;
  document.getElementById('ce-items').appendChild(div);
  div.querySelector('input').focus();
}
function updateItemVal(idx, val) { window._editItems[idx] = val; }
function removeItemRow(idx) {
  window._editItems[idx] = null;
  document.getElementById(`irow-${idx}`)?.remove();
}

function saveCat() {
  const name = document.getElementById('ce-name').value.trim();
  if (!name) { toast('カテゴリ名を入力してください'); return; }

  const typeEl  = document.querySelector('#ce-types .type-btn.selected');
  const iconEl  = document.querySelector('#ce-icons .icon-btn.selected');
  const colorEl = document.querySelector('#ce-colors .color-dot.selected');

  const catType  = typeEl?.dataset.type  || 'custom';
  const catIcon  = iconEl?.dataset.icon  || '📝';
  const catColor = colorEl?.dataset.color || '#6366f1';

  // Also read current input values
  document.querySelectorAll('#ce-items input').forEach((inp, i) => {
    if (inp.dataset.idx !== undefined) window._editItems[Number(inp.dataset.idx)] = inp.value.trim();
  });
  // 分類を使うカテゴリの服は「服の管理」で編集する（ここで上書きすると、過去の記録の名前と食い違う）
  const editing = editCatId ? state.cats.find(c => c.id === editCatId) : null;
  const items = editing && Array.isArray(editing.groups) && editing.groups.length
    ? editing.items
    : (window._editItems||[]).filter(v => v && v.trim());

  if (editCatId) {
    const cat = state.cats.find(c => c.id === editCatId);
    if (cat) { cat.name = name; cat.type = catType; cat.icon = catIcon; cat.color = catColor; cat.items = items; }
  } else {
    state.cats.push({ id: 'c'+Date.now(), name, type: catType, icon: catIcon, color: catColor, items, createdAt: Date.now() });
  }

  save();
  closeModal('cat-modal');
  renderSettings();
  toast(editCatId ? '更新しました ✓' : 'カテゴリを追加しました ✓');
  if (!editCatId) tutAfterCatSave();
}

function deleteCat(catId) {
  if (!confirm('このカテゴリを削除しますか？\nこのカテゴリのすべての記録も削除されます。')) return;
  state.cats = state.cats.filter(c => c.id !== catId);
  Object.keys(state.logs).forEach(d => {
    delete state.logs[d][catId];
    if (!Object.keys(state.logs[d]).length) delete state.logs[d];
  });
  save();
  closeModal('cat-modal');
  renderSettings();
  toast('削除しました');
}

// ─── DATA ─────────────────────────────────────────────────────
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lifelog_${today()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (!Array.isArray(imported.cats) || typeof imported.logs !== 'object' || imported.logs === null) throw new Error();
        if (!confirm('現在のデータをインポートデータで上書きしますか？')) return;
        LifeLogLogic.repairLogs(imported.logs);
        LifeLogLogic.repairMeta(imported);
        state = imported;
        save();
        undoStack = []; saveUndo(); // 取り込み前の状態へは戻せない（別のデータになるため）
        render[curView]();
        toast('インポートしました ✓');
      } catch { toast('ファイルが正しくありません'); }
    };
    reader.readAsText(file);
  };
  input.click();
}
function clearAll() {
  if (!confirm('全データを消去しますか？\nこの操作は元に戻せません。')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = { cats: [], logs: {} };
  undoStack = []; saveUndo();
  render[curView]();
  toast('データを消去しました');
}

// ─── WARDROBE（服の管理）────────────────────────────────────────
// ロジックは logic.js（LifeLogLogic）。ここは描画と操作のつなぎだけ。
const UNDO_KEY = 'lifelog_v2_undo';
let undoStack = (() => {
  try { const a = JSON.parse(localStorage.getItem(UNDO_KEY)); return Array.isArray(a) ? a : []; }
  catch { return []; }
})();
function saveUndo() {
  try { localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack)); return; } catch {}
  // 容量が足りないときは、古い順に捨てて保存し直す
  while (undoStack.length > 1) {
    undoStack = undoStack.slice(1);
    try { localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack)); return; } catch {}
  }
  try { localStorage.removeItem(UNDO_KEY); } catch {}
}

const wd = { catId: null, q: '', group: 'all', brand: 'all', brandPanel: false, status: 'active', sort: 'order', dir: 'asc', sel: new Set(), rows: [], bulk: { g: '', t: '', s: '', b: '' } };
const wdCand = { min: 60, all: false }; // 手放し候補：何日以上着ていない服か／季節を問わないか
const WD_ERR = {
  exists: '同じ名前の服がすでにあります',
  empty: '名前を入力してください',
  used: '記録のある服は削除できません。「手放した」にしてください',

  'no-brand': 'そのブランドはありません',
  storage: '保存容量が足りず、変更できませんでした（元の状態のままです）。エクスポートして、不要な記録を整理してください'
};
const wdMsg = res => WD_ERR[res && res.error] || 'できませんでした';

function wdCats() { return LifeLogLogic.wardrobeCategories(state); }
function wdCat() {
  const cs = wdCats();
  let c = cs.find(x => x.id === wd.catId);
  if (!c) {
    c = cs.slice().sort((a, b) => b.items.length - a.items.length)[0] || null;
    wd.catId = c ? c.id : null;
  }
  return c;
}
function wdStarted(cat) { return !!(cat && Array.isArray(cat.groups) && cat.groups.length); }
function wdOpen(catId) {
  if (catId) wd.catId = catId;
  wd.sel.clear();
  nav('wardrobe');
}

// 本体のデータを先に保存し、そのあとで元に戻す履歴を保存する。
// 本体が入らないときは、保存してある履歴を消して空きを作り、もう一度保存する。それでも入らなければ false。
function wdPersist() {
  const trySave = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; } catch { return false; } };
  if (!trySave()) {
    try { localStorage.removeItem(UNDO_KEY); } catch {}
    if (!trySave()) return false;
  }
  saveUndo(); // 履歴は本体のあと。入らなければ、古い順に捨てる
  return true;
}

// 変更を加える共通の入口：操作の直前の状態を保存し、成功したときだけ確定する
function wdMutate(label, fn) {
  // 直前の状態を10件まで保存する（容量が足りないときは、wdPersist／saveUndo が古い順に捨てる）
  const next = LifeLogLogic.pushSnapshot(undoStack, state, label, Date.now(), 10);
  const before = undoStack;
  const res = fn();
  if (!res || res.ok === false) return res || { ok: false, error: 'unknown' };
  undoStack = next;
  if (!wdPersist()) {
    // 容量が足りず保存できなかった。メモリだけ変更済みの状態を残さないよう、操作の前に戻す
    state = LifeLogLogic.popSnapshot(next).state;
    undoStack = before;
    saveUndo();
    return { ok: false, error: 'storage' };
  }
  return res;
}
function wdAfter() { renderWardrobe(); }

const optHtml = (value, label, selected) => `<option value="${esc(value)}"${selected ? ' selected' : ''}>${esc(label)}</option>`;
const sortHead = (key, label) => `<button class="${wd.sort === key ? 'on' : ''}" onclick="wdSort('${key}')">${label}${wd.sort === key ? (wd.dir === 'asc' ? ' ▲' : ' ▼') : ''}</button>`;

function renderWardrobe() {
  const el = document.getElementById('view-wardrobe');
  const cat = wdCat();
  const last = undoStack[undoStack.length - 1];
  const top = `
    <div class="wd-top">
      <button class="wd-back" onclick="nav('settings')">‹ 設定</button>
      <div class="wd-title">服の管理</div>
      <button class="btn-sm wd-undo" onclick="wdUndo()" ${last ? '' : 'disabled'}>↩ 元に戻す</button>
    </div>
    ${last ? `<div class="hint wd-undo-note">直前の操作：${esc(last.label)}（${undoStack.length}件まで戻せます）</div>` : ''}`;
  if (!cat) {
    el.innerHTML = top + `<div class="empty"><div class="empty-emoji">👗</div><p>服の管理は、種類が「ファッション」のカテゴリで使えます。<br>設定でカテゴリにアイテムを登録してください。</p></div>`;
    return;
  }
  const started = wdStarted(cat);
  const brands = Array.isArray(cat.brands) ? cat.brands : [];
  // 絞り込みの対象（グループ・ブランド）がいまのカテゴリに無ければ解除する（元に戻す・カテゴリの切り替えのあとなど）
  if (wd.group !== 'all' && !(started && (wd.group === 'none' || cat.groups.some(g => g.id === wd.group)))) wd.group = 'all';
  if (wd.brand !== 'all' && wd.brand !== 'none' && !brands.some(b => b.id === wd.brand)) wd.brand = 'all';
  const catsHtml = wdCats().map(c => `<button class="chip ${c.id === cat.id ? 'selected' : ''}" onclick="wdSelCat('${c.id}')">${esc(c.icon || '')} ${esc(c.name)}<span class="wd-n">${c.items.length}</span></button>`).join('');
  const groupOpts = optHtml('all', 'すべてのグループ', wd.group === 'all')
    + (started ? optHtml('none', '未設定', wd.group === 'none') + cat.groups.map(g => optHtml(g.id, g.name, wd.group === g.id)).join('') : '');
  const unresolved = started ? LifeLogLogic.suggestMeta(cat).length : 0;
  const brandSug = LifeLogLogic.suggestBrands(cat).length;
  const brandOpts = optHtml('all', 'すべてのブランド', wd.brand === 'all') + optHtml('none', 'ブランド未設定', wd.brand === 'none')
    + brands.map(b => optHtml(b.id, b.short ? `${b.name}（${b.short}）` : b.name, wd.brand === b.id)).join('');
  const sortOpts = [['order', '登録順'], ['name', '名前'], ['group', 'グループ'], ['brand', 'ブランド'], ['season', '季節'], ['qty', '着数'], ['count', '着用回数'], ['last', '最終着用日']]
    .map(([k, l]) => optHtml(k + ':asc', l + (k === 'order' ? '' : '（昇順）'), wd.sort === k && wd.dir === 'asc') + (k === 'order' ? '' : optHtml(k + ':desc', l + '（降順）', wd.sort === k && wd.dir === 'desc'))).join('');

  el.innerHTML = top + `
    <div class="wd-cats">${catsHtml}</div>
    ${started ? '' : `
    <div class="card wd-banner">
      <div style="font-weight:800;font-size:15px">このカテゴリの分類を始める</div>
      <p>服を「トップス／ボトムス／アウター」のグループと、その中の種類（半袖T・パーカー・ジャケットなど）に分けて管理できます。名前から自動で振り分けるので、確認して、外れたものだけ直してください。過去の記録は変わりません。</p>
      <button class="btn btn-primary" onclick="wdStart()">分類を始めて、名前から振り分ける</button>
    </div>`}
    <div class="wd-add">
      <input class="field-input" id="wd-add-name" placeholder="新しい服の名前${started ? '（グループ・季節は名前から自動）' : ''}" autocomplete="off" onkeydown="if(event.key==='Enter')wdAdd()">
      <button class="btn-sm" style="background:var(--primary);color:#fff" onclick="wdAdd()">＋ 追加</button>
    </div>
    <div class="wd-tool">
      <input class="field-input" id="wd-q" type="search" placeholder="名前で検索" value="${esc(wd.q)}" oninput="wdSearch(this.value)">
      <select class="wd-sel" aria-label="グループで絞り込む" onchange="wdFilter('group',this.value)">${groupOpts}</select>
      ${brands.length ? `<select class="wd-sel" aria-label="ブランドで絞り込む" onchange="wdFilter('brand',this.value)">${brandOpts}</select>` : ''}
      <div class="wd-seg">
        <button aria-pressed="${wd.status === 'active'}" onclick="wdFilter('status','active')">現役</button>
        <button aria-pressed="${wd.status === 'kept'}" onclick="wdFilter('status','kept')">出さない</button>
        <button aria-pressed="${wd.status === 'gone'}" onclick="wdFilter('status','gone')">手放した</button>
        <button aria-pressed="${wd.status === 'all'}" onclick="wdFilter('status','all')">すべて</button>
      </div>
      <select class="wd-sel wd-sortsel" aria-label="並べ替え" onchange="wdSortSel(this.value)">${sortOpts}</select>
      ${started && unresolved ? `<button class="btn-sm" style="background:var(--primary-light);color:var(--primary)" onclick="wdSuggestOpen()">名前から一括設定（未設定${unresolved}件）</button>` : ''}
      <button class="btn-sm" style="background:var(--card);border:1px solid var(--border);color:var(--text)" aria-expanded="${wd.brandPanel}" onclick="wdBrandPanel()">ブランドの管理${brands.length ? `（${brands.length}）` : ''}</button>
      ${brandSug ? `<button class="btn-sm" style="background:var(--primary-light);color:var(--primary)" onclick="wdBrandSuggestOpen()">名前からブランドを推定（${brandSug}件）</button>` : ''}
      <button class="btn-sm" id="wd-cand-btn" style="background:var(--card);border:1px solid var(--border);color:var(--text)" onclick="wdCandOpen()" title="しばらく着ていない服を並べて、手放すか残すかを選べます">手放し候補（${wdCandCount(cat)}）</button>
    </div>
    ${wd.brandPanel ? wdBrandPanelHtml(cat) : ''}
    <div id="wd-list"></div>`;
  renderWardrobeList();
}

function renderWardrobeList() {
  const cat = wdCat();
  const box = document.getElementById('wd-list');
  if (!cat || !box) return;
  const started = wdStarted(cat);
  const brands = Array.isArray(cat.brands) ? cat.brands : [];
  const rows = LifeLogLogic.wardrobeRows(cat, state.logs, { q: wd.q, group: wd.group, brand: wd.brand, status: wd.status, sort: wd.sort, dir: wd.dir });
  wd.rows = rows;
  const shown = new Set(rows.map(r => r.name));
  [...wd.sel].forEach(n => { if (!shown.has(n)) wd.sel.delete(n); });

  // 一括操作バー
  let bulk = '';
  if (wd.sel.size) {
    const names = [...wd.sel];
    const gs = new Set(names.map(n => LifeLogLogic.getMeta(cat, n).g));
    const typeGroup = wd.bulk.g && wd.bulk.g !== '__none' ? wd.bulk.g : (gs.size === 1 ? [...gs][0] : null);
    const typeList = typeGroup ? (cat.types && Object.prototype.hasOwnProperty.call(cat.types, typeGroup) ? cat.types[typeGroup] : []) : [];
    bulk = `<div class="wd-bulk">
      <b>${wd.sel.size}件を選択中</b>
      ${started ? `
      <select class="wd-sel" aria-label="グループ" onchange="wd.bulk.g=this.value;wd.bulk.t='';renderWardrobeList()">${optHtml('', 'グループ（変更しない）', !wd.bulk.g)}${optHtml('__none', '未設定にする', wd.bulk.g === '__none')}${cat.groups.map(g => optHtml(g.id, g.name, wd.bulk.g === g.id)).join('')}</select>
      <select class="wd-sel" aria-label="種類" onchange="wd.bulk.t=this.value" ${typeGroup ? '' : 'disabled'}>${optHtml('', '種類（変更しない）', !wd.bulk.t)}${typeList.map(t => optHtml(t, t, wd.bulk.t === t)).join('')}</select>` : ''}
      ${brands.length ? `<select class="wd-sel" aria-label="ブランド" onchange="wd.bulk.b=this.value">${optHtml('', 'ブランド（変更しない）', !wd.bulk.b)}${optHtml('__none', '未設定にする', wd.bulk.b === '__none')}${brands.map(b => optHtml(b.id, LifeLogLogic.brandText(b), wd.bulk.b === b.id)).join('')}</select>` : ''}
      <select class="wd-sel" aria-label="季節" onchange="wd.bulk.s=this.value">${optHtml('', '季節（変更しない）', !wd.bulk.s)}${LifeLogLogic.SEASONS.map(x => optHtml(x, x, wd.bulk.s === x)).join('')}</select>
      <button class="btn-sm" style="background:var(--primary);color:#fff" onclick="wdBulk('apply')">適用</button>
      <button class="btn-sm" style="background:var(--card);border:1px solid var(--border);color:var(--text)" onclick="wdBulk('kept')">出さない</button>
      <button class="btn-sm" style="background:var(--card);border:1px solid var(--border);color:var(--text)" onclick="wdBulk('retire')">手放した</button>
      <button class="btn-sm" style="background:var(--card);border:1px solid var(--border);color:var(--text)" onclick="wdBulk('active')">現役に戻す</button>
      <button class="btn-sm" style="background:var(--card);border:1px solid var(--border);color:var(--text)" onclick="wdMergeOpen()" ${wd.sel.size >= 2 ? '' : 'disabled'}>統合…</button>
      <button class="btn-sm" style="background:transparent;color:var(--text-2)" onclick="wdSelAll(false)">選択を解除</button>
    </div>`;
  }

  const head = `<div class="wd-head">
    <span><input type="checkbox" aria-label="すべて選択" ${rows.length && rows.every(r => wd.sel.has(r.name)) ? 'checked' : ''} onchange="wdSelAll(this.checked)"></span>
    ${sortHead('name', '名前')}${started ? sortHead('group', 'グループ') + sortHead('type', '種類') : '<span></span><span></span>'}${sortHead('brand', 'ブランド')}${sortHead('season', '季節')}${sortHead('qty', '着数')}${sortHead('status', '状態')}${sortHead('count', '着用（回数・最終）')}<span></span>
  </div>`;

  const body = rows.map((r, i) => {
    const typeList = started && r.g && cat.types && Object.prototype.hasOwnProperty.call(cat.types, r.g) ? cat.types[r.g] : [];
    const used = LifeLogLogic.isItemUsed(state.logs, cat.id, r.name);
    return `<div class="wd-row ${r.r ? 'gone' : ''} ${wd.sel.has(r.name) ? 'selected' : ''}">
      <span><input type="checkbox" aria-label="${esc(r.name)}を選択" ${wd.sel.has(r.name) ? 'checked' : ''} onchange="wdSel(${i},this.checked)"></span>
      <input class="wd-name" value="${esc(r.name)}" aria-label="名前" onchange="wdName(${i},this.value)" onkeydown="if(event.key==='Enter')this.blur()">
      ${started ? `<select class="wd-sel" aria-label="グループ" onchange="wdSet(${i},'g',this.value)">${optHtml('', '未設定', r.g == null)}${cat.groups.map(g => optHtml(g.id, g.name, r.g === g.id)).join('')}</select>
      <select class="wd-sel" aria-label="種類" onchange="wdSet(${i},'t',this.value)" ${r.g ? '' : 'disabled'}>${optHtml('', '種類なし', !r.t)}${typeList.map(t => optHtml(t, t, r.t === t)).join('')}</select>` : '<span class="wd-gap"></span><span class="wd-gap"></span>'}
      ${brands.length
        ? `<select class="wd-sel" aria-label="ブランド" title="${esc((brands.find(b => b.id === r.b) || {}).name || '')}" onchange="wdSet(${i},'b',this.value)">${optHtml('', '未設定', r.b == null)}${brands.map(b => optHtml(b.id, LifeLogLogic.brandText(b), r.b === b.id)).join('')}</select>`
        : `<select class="wd-sel" aria-label="ブランド" disabled title="「ブランドの管理」でブランドを登録すると選べます"><option>未登録</option></select>`}
      <select class="wd-sel" aria-label="季節" onchange="wdSet(${i},'s',this.value)">${LifeLogLogic.SEASONS.map(x => optHtml(x, x, r.s === x)).join('')}</select>
      <span class="wd-stepper" title="同じような服を何着持っているか"><button aria-label="着数を減らす" onclick="wdQty(${i},-1)">−</button><span>${r.q}着</span><button aria-label="着数を増やす" onclick="wdQty(${i},1)">＋</button></span>
      <select class="wd-sel wd-status" aria-label="状態" title="現役＝普通に使う／出さない＝持っているが、記録画面の上の列やバリエーション・提案に出さない（礼服・部屋着・着ない服など）／手放した＝記録画面から隠す（記録と統計は残る）" onchange="wdStatus(${i},this.value)">${optHtml('active', '現役', !r.r && !r.z)}${optHtml('kept', '出さない', !r.r && r.z)}${optHtml('gone', '手放した', r.r)}</select>
      <span class="wd-use">${r.count}回${r.last ? ' · ' + esc(r.last.slice(5).replace('-', '/')) : ''}</span>
      <button class="wd-del" aria-label="${esc(r.name)}を削除" title="${used ? '記録のある服は削除できません（「手放した」にしてください）' : '削除'}" onclick="wdDel(${i})" ${used ? 'disabled' : ''}>✕</button>
    </div>`;
  }).join('');

  box.innerHTML = bulk + (rows.length ? head + body : `<div class="empty" style="padding:24px 0"><p>${wd.q || wd.group !== 'all' || wd.brand !== 'all' || wd.status !== 'all' ? '条件に合う服がありません' : '服がありません'}</p></div>`);
}

// ── 絞り込み・並べ替え・選択 ──
function wdSelCat(id) { wd.catId = id; wd.sel.clear(); wd.group = 'all'; wd.brand = 'all'; wd.bulk = { g: '', t: '', s: '', b: '' }; renderWardrobe(); }
function wdSearch(v) { wd.q = v; renderWardrobeList(); }
function wdFilter(k, v) { wd[k] = v; renderWardrobe(); }
function wdSort(key) { if (wd.sort === key) wd.dir = wd.dir === 'asc' ? 'desc' : 'asc'; else { wd.sort = key; wd.dir = 'asc'; } renderWardrobe(); }
function wdSortSel(v) { const [k, d] = v.split(':'); wd.sort = k; wd.dir = d || 'asc'; renderWardrobe(); }
function wdSel(i, on) { const r = wd.rows[i]; if (!r) return; on ? wd.sel.add(r.name) : wd.sel.delete(r.name); renderWardrobeList(); }
function wdSelAll(on) { wd.sel.clear(); if (on) wd.rows.forEach(r => wd.sel.add(r.name)); renderWardrobeList(); }

// ── ブランド ──
function wdBrandPanelHtml(cat) {
  const brands = Array.isArray(cat.brands) ? cat.brands : [];
  const counts = LifeLogLogic.brandCounts(cat);
  const rows = brands.map((b, i) => {
    const n = Object.prototype.hasOwnProperty.call(counts, b.id) ? counts[b.id] : 0;
    return `<div class="wd-brandrow">
      <input value="${esc(b.name)}" aria-label="正式名称" onchange="wdBrandEdit(${i},'name',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
      <input value="${esc(b.short || '')}" placeholder="略称" aria-label="略称" onchange="wdBrandEdit(${i},'short',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
      <span class="wd-use">${n}件</span>
      <button class="wd-del" aria-label="${esc(b.name)}を削除" title="${n ? '使っている服があるため削除できません' : '削除'}" onclick="wdBrandDel(${i})" ${n ? 'disabled' : ''}>✕</button>
    </div>`;
  }).join('');
  return `<div class="card wd-brands">
    <h3>ブランドの管理（${esc(cat.name)}）</h3>
    <p class="sub">正式名称は一覧・絞り込みに、略称（任意）は表や選択欄などの狭いところに出ます。名前や略称を直すと、付いている服も一緒に変わります。</p>
    ${rows || '<div class="hint" style="padding:6px 0">まだブランドがありません。下から追加するか、「名前からブランドを推定」を使ってください。</div>'}
    <div class="wd-brandrow add">
      <input id="wd-bn" placeholder="正式名称（例：Paul Smith）" autocomplete="off" aria-label="新しいブランドの正式名称" onkeydown="if(event.key==='Enter')wdBrandAdd()">
      <input id="wd-bs" placeholder="略称（任意）" autocomplete="off" aria-label="新しいブランドの略称" onkeydown="if(event.key==='Enter')wdBrandAdd()">
      <button class="btn-sm" style="background:var(--primary);color:#fff" onclick="wdBrandAdd()">＋ 追加</button>
    </div>
  </div>`;
}
function wdBrandPanel() { wd.brandPanel = !wd.brandPanel; renderWardrobe(); }
function wdBrandAdd() {
  const cat = wdCat(); if (!cat) return;
  const name = document.getElementById('wd-bn')?.value || '', short = document.getElementById('wd-bs')?.value || '';
  const res = wdMutate('ブランドを追加', () => LifeLogLogic.addBrand(cat, name, short));
  if (res.ok) toast(`ブランド「${name.trim()}」を追加しました`); else toast(wdMsg(res));
  wdAfter();
  if (res.ok) document.getElementById('wd-bn')?.focus();
}
function wdBrandEdit(i, field, value) {
  const cat = wdCat(), b = cat && (cat.brands || [])[i]; if (!b) return;
  const res = wdMutate('ブランドを変更', () => LifeLogLogic.updateBrand(cat, b.id, { [field]: value }));
  if (res.ok === false) toast(wdMsg(res));
  wdAfter();
}
function wdBrandDel(i) {
  const cat = wdCat(), b = cat && (cat.brands || [])[i]; if (!b) return;
  if (!confirm(`ブランド「${b.name}」を削除しますか？\n（使っている服がないブランドです。元に戻すで復元できます）`)) return;
  const res = wdMutate('ブランドを削除', () => LifeLogLogic.deleteBrand(cat, b.id));
  if (res.ok === false) toast(res.error === 'used' ? `このブランドを使っている服が${res.count}件あるため、削除できません` : wdMsg(res));
  else { if (wd.brand === b.id) wd.brand = 'all'; toast(`ブランド「${b.name}」を削除しました`); }
  wdAfter();
}
function wdBrandSuggestOpen() {
  const cat = wdCat(); if (!cat) return;
  const props = LifeLogLogic.suggestBrands(cat);
  const groups = new Map();
  props.forEach(p => { const k = p.brand; if (!groups.has(k)) groups.set(k, { isNew: p.id === null, names: [] }); groups.get(k).names.push(p.name); });
  const created = [...groups.values()].filter(g => g.isNew).length;
  document.getElementById('wd-modal-body').innerHTML = `
    <div class="modal-handle"></div>
    <div class="modal-title">名前からブランドを推定</div>
    <div class="modal-subtitle">ブランドが未設定の服${props.length}件に、名前から推定したブランドを設定します。「新規」のブランドは、正式名称として登録します（略称や正式名称は、あとで「ブランドの管理」で直せます）。</div>

function wdBulk(kind) {

  else if (kind === 'kept') patch = WD_STATUS.kept.patch;
  else if (kind === 'active') patch = WD_STATUS.active.patch;
  else {
    patch = {};

    if (wd.bulk.t) patch.t = wd.bulk.t;
    if (wd.bulk.s) patch.s = wd.bulk.s;
    if (wd.bulk.b) patch.b = wd.bulk.b === '__none' ? null : wd.bulk.b;
    if (!Object.keys(patch).length) { toast('変更する項目を選んでください'); return; }
  }
  const res = wdMutate(`${names.length}件を一括変更`, () => LifeLogLogic.bulkSetMeta(cat, names, patch));
  if (res.ok === false) { toast(res.name ? `「${res.name}」: ${wdMsg(res)}` : wdMsg(res)); return; }

// ── 元に戻す ──
function wdUndo() {
  const last = undoStack[undoStack.length - 1]; if (!last) return;
  // 操作のあとに付けた記録があれば、戻すと消えることを知らせる
  const newer = Object.values(state.logs || {}).some(day => day && Object.values(day).some(e => e && e.ts > last.ts));
  const msg = `「${last.label}」の前の状態に戻します。` + (newer ? '\nその後に付けた記録も消えます。' : '') + '\nよろしいですか？';
  if (!confirm(msg)) return;
  const popped = LifeLogLogic.popSnapshot(undoStack);
  const prevState = state, prevStack = undoStack;
  state = popped.state;
  undoStack = popped.stack;
  if (!wdPersist()) {
    // 保存できなかったときは、メモリだけ戻った状態を残さない
    state = prevState;
    undoStack = prevStack;
    saveUndo();
    toast(wdMsg({ error: 'storage' }));
    return;
  }
  wd.sel.clear();
  toast(`「${popped.label}」の前に戻しました`);
  wdAfter();
}

// ─── SHOPPING LIST ────────────────────────────────────────────
let shopType = 'once'; // 'once' | 'recurring'
const SHOP_TIP_KEY = 'lifelog_shop_tip_done';
let shopTipVisible = !localStorage.getItem(SHOP_TIP_KEY);

function shopTipHtml() {

  return `
    <div class="card" style="background:var(--primary-light);border:1px solid var(--primary);position:relative">

      <div style="font-size:13px;line-height:1.7;color:var(--text-2)">
        <b>1回だけ</b> — 卵や牛乳など、買ったら完了<br>
        <b>🔄 定期品</b> — 歯磨き粉や洗剤など、定期的に買うもの<br><br>

        定期品は「リセット」で次回の買い物に再利用。<br>

function dismissShopTip() {
  shopTipVisible = false;
  localStorage.setItem(SHOP_TIP_KEY, '1');

}

function showShopTip() {
  shopTipVisible = true;
  renderShopping();
}

function renderShopping() {
  const el = document.getElementById('view-shopping');
  const items = state.shopping || [];
  const pending      = items.filter(i => !i.checked);
  const doneOnce     = items.filter(i => i.checked && !i.recurring);
  const doneRecur    = items.filter(i => i.checked && i.recurring);

  const row = i => `
    <div class="shop-row ${i.checked?'checked':''}">
      <button class="shop-check" onclick="toggleShop('${i.id}')">${i.checked?'☑':'☐'}</button>
      <span class="shop-name">${esc(i.name)}</span>
      ${i.recurring ? '<span class="shop-tag">🔄 定期</span>' : ''}
      <button class="shop-del" onclick="deleteShopItem('${i.id}')">✕</button>
    </div>`;

  el.innerHTML = `
    ${shopTipHtml()}
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="field-label" style="margin:0">アイテムを追加</div>
        ${!shopTipVisible ? '<button onclick="showShopTip()" style="background:none;border:1px solid var(--border);border-radius:50%;width:24px;height:24px;font-size:13px;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center">?</button>' : ''}
      </div>
      <div class="shop-add-row">
        <input class="field-input" id="shop-input" placeholder="例: 卵、牛乳、歯磨き粉..."
               onkeydown="if(event.key==='Enter')addShopItem()" style="flex:1">
        <button class="btn btn-primary" style="width:auto;padding:12px 16px;flex-shrink:0" onclick="addShopItem()">追加</button>
      </div>
      <div class="shop-type-toggle">
        <button class="shop-type-btn ${shopType==='once'?'active':''}" onclick="setShopType('once')">1回だけ</button>
        <button class="shop-type-btn ${shopType==='recurring'?'active':''}" onclick="setShopType('recurring')">🔄 定期品</button>
      </div>
    </div>

    ${pending.length ? `<div class="section-title">買うもの (${pending.length}件)</div>${pending.map(row).join('')}` : ''}

    ${doneRecur.length ? `
      <div class="section-title">購入済みの定期品 (${doneRecur.length}件)</div>
      ${doneRecur.map(row).join('')}
      <button class="btn btn-secondary" style="margin-top:8px" onclick="resetRecurringShop()">🔄 定期品をリセット（次回分へ）</button>` : ''}

    ${doneOnce.length ? `
      <div class="section-title">購入済み・1回品 (${doneOnce.length}件)</div>
      ${doneOnce.map(row).join('')}
      <button class="btn btn-secondary" style="margin-top:8px;background:var(--danger);color:white;border:none" onclick="clearOnceShop()">🗑️ 1回品をすべて削除</button>` : ''}

    ${!pending.length && !doneRecur.length && !doneOnce.length ? `<div class="empty"><div class="empty-emoji">🛒</div><p>買い物リストは空です<br>必要なものを追加しましょう</p></div>` : ''}
  `;
}

function setShopType(type) { shopType = type; renderShopping(); }

function addShopItem() {
  const input = document.getElementById('shop-input');
  const name = input.value.trim();
  if (!name) return;
  if (!state.shopping) state.shopping = [];
  state.shopping.unshift({ id: 's'+Date.now(), name, checked: false, recurring: shopType === 'recurring', addedAt: Date.now() });
  save();
  input.value = '';
  renderShopping();
  toast(`「${name}」を追加しました`);
}

function toggleShop(id) {
  const item = (state.shopping||[]).find(i => i.id === id);
  if (item) { item.checked = !item.checked; save(); renderShopping(); }
}

function deleteShopItem(id) {
  state.shopping = (state.shopping||[]).filter(i => i.id !== id);
  save();
  renderShopping();
}

function resetRecurringShop() {
  (state.shopping||[]).filter(i => i.recurring).forEach(i => i.checked = false);
  save();
  renderShopping();
  toast('定期品をリセットしました');
}

function clearOnceShop() {
  if (!confirm('1回品をすべて削除しますか？')) return;
  state.shopping = (state.shopping||[]).filter(i => i.recurring || !i.checked);
  save();
  renderShopping();
  toast('削除しました');
}

// ─── Utilities ────────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
function overlayClose(overlay, id) { if (event.target === overlay) closeModal(id); }

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── TUTORIAL ────────────────────────────────────────────────
const TUT_KEY = 'lifelog_tut_done';
let tut = 0;

function tutStart() {
  tut = 1;
  tutRender();
}

function tutRender() {
  const c = document.getElementById('tut-container');
  if (tut === 1) {
    c.innerHTML = `
      <div class="tut-backdrop"></div>
      <div class="tut-card">
        <div class="tut-card-inner">
          <div class="tut-emoji">📔</div>
          <div class="tut-title">LifeLogへようこそ！</div>
          <div class="tut-desc">
            毎日の記録をつけるライフログアプリです。<br>
            コーディネート・食事・運動など、自分だけの<br>カテゴリを作って記録しましょう。
          </div>
          <button class="btn btn-primary" onclick="tutStep2()">はじめる →</button>
          <br><button class="tut-skip" onclick="tutDone()">スキップ</button>
        </div>
      </div>`;
  } else if (tut === 2) {
    requestAnimationFrame(() => {
      const btn = document.querySelector('.add-cat-btn');
      if (btn) btn.classList.add('tut-highlight');
      const r = btn?.getBoundingClientRect();
      const top = r ? r.bottom + 12 : 300;
      c.innerHTML = `
        <div class="tut-backdrop"></div>
        <div class="tut-tip" style="top:${top}px">
          <strong>👆 カテゴリを追加しましょう</strong><br>
          上のボタンをタップして、最初のカテゴリを作ってみましょう。<br>
          例：👗 コーディネート、🍽️ 食事、💊 サプリなど
          <br><button class="tut-skip" onclick="tutDone()">スキップ</button>
        </div>`;
    });
  } else if (tut === 3) {
    requestAnimationFrame(() => {
      const cards = document.querySelectorAll('.cat-card');
      const card = cards[cards.length - 1];
      if (card) card.classList.add('tut-highlight');
      const r = card?.getBoundingClientRect();
      const top = r ? r.bottom + 12 : 300;
      c.innerHTML = `
        <div class="tut-backdrop"></div>
        <div class="tut-tip" style="top:${top}px">
          <strong>👆 タップして記録しましょう</strong><br>
          作ったカテゴリをタップすると、今日の記録ができます。
          <br><button class="tut-skip" onclick="tutDone()">閉じる</button>
        </div>`;
    });
  } else if (tut === 4) {
    c.innerHTML = `
      <div class="tut-backdrop"></div>
      <div class="tut-card">
        <div class="tut-card-inner">
          <div class="tut-emoji">🎉</div>
          <div class="tut-title">準備完了！</div>
          <div class="tut-desc">
            使い方はバッチリです。<br>
            カテゴリは設定画面からいつでも追加できます。<br>
            毎日の記録を楽しんでください！
          </div>
          <button class="btn btn-primary" onclick="tutDone()">閉じる</button>
        </div>
      </div>`;
  } else {
    c.innerHTML = '';
  }
}

function tutStep2() {
  tut = 2;
  nav('settings');
  tutRender();
}

function tutAfterCatSave() {
  if (tut !== 2) return;
  tut = 3;
  nav('today');
  tutRender();
}

function tutAfterLogSave() {
  if (tut !== 3) return;
  tut = 4;
  tutRender();
}

function tutDone() {
  tut = 0;
  localStorage.setItem(TUT_KEY, '1');
  document.querySelectorAll('.tut-highlight').forEach(e => e.classList.remove('tut-highlight'));
  document.getElementById('tut-container').innerHTML = '';
}

function tutReplay() {
  localStorage.removeItem(TUT_KEY);
  tutStart();
}

// ─── Init ─────────────────────────────────────────────────────
renderToday();
if (!localStorage.getItem(TUT_KEY) && !state.cats.length) tutStart();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
